# Runs on every pull request and every push to main.
# A pull request can't be merged until these pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dutyboard_test
          POSTGRES_USER: dutyboard
          POSTGRES_PASSWORD: dutyboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dutyboard"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: dutyboard
      DB_PASSWORD: dutyboard

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip
          coverage: none

      - name: Install PHP packages
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check packages for known security problems
        run: composer audit

      - name: Check code formatting
        run: ./vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  containers:
    name: Development containers start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          echo "DUTYBOARD_UID=$(id -u)" >> .env
          echo "DUTYBOARD_GID=$(id -g)" >> .env
          docker compose build

      - name: Start containers
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/login > /dev/null; then echo "App is up"; exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Load sample data and sign in
        run: |
          docker compose exec -T app php artisan db:seed --force
          curl -fsS -c jar.txt http://localhost:8080/login -o login.html
          token=$(grep -o 'name="_token" value="[^"]*"' login.html | sed 's/.*value="//;s/"//')
          status=$(curl -s -b jar.txt -c jar.txt -o /dev/null -w '%{http_code}' \
            --data-urlencode "_token=$token" -d username=dwhitfield -d password=dutyboard \
            http://localhost:8080/login)
          test "$status" = "302"
          curl -fsS -b jar.txt http://localhost:8080/admin/users | grep -q "Jordan Alvarez"

      - name: Run tests inside the container
        run: docker compose exec -T app php artisan test

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
